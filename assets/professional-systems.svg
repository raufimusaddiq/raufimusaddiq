<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Raufi Musaddiq — Professional Systems</title>
  <desc id="desc">NDA-safe overview of current production work at DANA across Security and User Management, plus earlier backend and product engineering.</desc>
  <style>
    :root { --bg:#f3f1ea; --panel:#ebe8df; --fg:#171717; --muted:#716d64; --faint:#9e998f; --line:#c7c2b7; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111210; --panel:#191a17; --fg:#f1efe8; --muted:#aaa59a; --faint:#77736c; --line:#3b3c37; } }
    text { font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
    .label { font-size:12px; letter-spacing:1.35px; fill:var(--muted); }
    .tiny { font-size:10px; letter-spacing:.9px; fill:var(--faint); }
    .hero { font-size:43px; font-weight:700; letter-spacing:-1.7px; fill:var(--fg); }
    .box-title { font-size:15px; font-weight:700; fill:var(--fg); }
    .box-sub { font-size:11px; fill:var(--muted); }
  </style>
  <rect width="1200" height="430" fill="var(--bg)"/>
  <rect x="30" y="30" width="1140" height="370" rx="5" fill="none" stroke="var(--line)"/>

  <text x="58" y="66" class="label">PROFESSIONAL SYSTEMS / PRODUCTION</text>
  <text x="1010" y="66" class="tiny">PUBLIC SCOPE / NDA-SAFE</text>
  <line x1="58" y1="84" x2="1142" y2="84" stroke="var(--line)"/>

  <text x="58" y="142" class="hero">DANA / SECURITY + USER MANAGEMENT</text>
  <text x="58" y="172" class="label">BACKEND ENGINEERING · 2022 — NOW</text>
  <line x1="58" y1="204" x2="1142" y2="204" stroke="var(--line)"/>

  <g>
    <rect x="58" y="226" width="250" height="88" rx="3" fill="var(--panel)" stroke="var(--line)"/>
    <text x="76" y="253" class="tiny">01 / VERIFY</text>
    <text x="76" y="281" class="box-title">Identity &amp; verification</text>
    <text x="76" y="301" class="box-sub">biometric · liveness · KBA</text>

    <rect x="322" y="226" width="250" height="88" rx="3" fill="var(--panel)" stroke="var(--line)"/>
    <text x="340" y="253" class="tiny">02 / USER</text>
    <text x="340" y="281" class="box-title">Auth &amp; account lifecycle</text>
    <text x="340" y="301" class="box-sub">login · passkeys · reactivation</text>

    <rect x="586" y="226" width="250" height="88" rx="3" fill="var(--panel)" stroke="var(--line)"/>
    <text x="604" y="253" class="tiny">03 / SECURITY</text>
    <text x="604" y="281" class="box-title">Risk &amp; abuse controls</text>
    <text x="604" y="301" class="box-sub">device signals · rollout controls</text>

    <rect x="850" y="226" width="292" height="88" rx="3" fill="var(--panel)" stroke="var(--line)"/>
    <text x="868" y="253" class="tiny">04 / PAYMENTS</text>
    <text x="868" y="281" class="box-title">Recurring payments</text>
    <text x="868" y="301" class="box-sub">timeouts · bounded retries</text>
  </g>

  <line x1="183" y1="314" x2="183" y2="339" stroke="var(--line)"/>
  <line x1="447" y1="314" x2="447" y2="339" stroke="var(--line)"/>
  <line x1="711" y1="314" x2="711" y2="339" stroke="var(--line)"/>
  <line x1="996" y1="314" x2="996" y2="339" stroke="var(--line)"/>
  <line x1="183" y1="339" x2="996" y2="339" stroke="var(--line)" stroke-dasharray="5 7"/>

  <text x="58" y="368" class="tiny">EARLIER / BEEHIVE DRONES · BACKEND + IOT · 2019—2022</text>
  <text x="633" y="368" class="tiny">MAJAPAHITECH · ANDROID · 2018—2019</text>
  <text x="58" y="389" class="tiny">INTERNAL ARCHITECTURE · VENDORS · METRICS · THRESHOLDS · PROPRIETARY LOGIC INTENTIONALLY OMITTED</text>
</svg>